<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screen Sizes</title>
    <style>
        :root {
            --mi-color: #ff3220;
            --mi-fuente: monospace;
            --mi-padding: 20px
        }
    </style>
    <style>
        #button1 {
            font-family: 'Courier New', Courier, monospace;
            border-radius: 0%;
            background-color: rgb(0, 255, 0)
        }
    </style>
  </head>
  <body>
    <button onclick="agregarDiv()" id="button1">Presioname!</button>
    <script>
        function agregarDiv() {
            const nuevoDiv = document.createElement("div");
            nuevoDiv.textContent = "Hola! Java";
            nuevoDiv.style.color = "#ffffff";
            nuevoDiv.style.padding = "10px";
            nuevoDiv.style.backgroundColor = "#0b1d3b"
            nuevoDiv.style.borderRadius = "30px"
            nuevoDiv.style.marginTop = "10px"
            nuevoDiv.style.width = "10%"
            document.body.appendChild(nuevoDiv);
        }
    </script>
  </body>
</html>
